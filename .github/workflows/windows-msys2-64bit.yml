name: Build image-label-gui (Pure MSYS2 UCRT64)

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. 初始化 UCRT64 环境并安装所需依赖（其中已包含原生的 wx-config）
      - name: Setup MSYS2 environment (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            curl
            unzip
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-codeblocks
            mingw-w64-ucrt-x86_64-wxwidgets3.3-msw

      # 2. 安装 pedeps 工具
      - name: Install pedeps
        run: |
          LATEST_VERSION=$(curl -s https://api.github.com/repos/brechtsanders/pedeps/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          curl -sL "https://github.com/brechtsanders/pedeps/releases/download/${LATEST_VERSION}/pedeps-${LATEST_VERSION}-win64.zip" -o pedeps.zip
          unzip -q pedeps.zip -d /tmp/pedeps
          cp /tmp/pedeps/bin/* /ucrt64/bin/
          rm -rf pedeps.zip /tmp/pedeps

      # 3. 配置 Code::Blocks 的 global_variables (将 WX_CONFIG / wx 映射为系统的 wx-config)
      - name: Configure Code::Blocks Global Variables
        run: |
          CONF_DIR="$HOME/AppData/Roaming/codeblocks"
          mkdir -p "$CONF_DIR"

          cat << 'EOF' > "$CONF_DIR/default.conf"
          <?xml version="1.0" encoding="UTF-8" standalone="yes" ?>
          <codeblocks_config file_version="1.0" app_version="1.0">
            <global_variables>
              <builtin>
                <WX_CONFIG>
                  <basepath><str><![CDATA[wx-config]]></str></basepath>
                  <str><![CDATA[wx-config]]></str>
                </WX_CONFIG>
                <wx>
                  <basepath><str><![CDATA[/ucrt64]]></str></basepath>
                  <include><str><![CDATA[/ucrt64/include/wx-3.3]]></str></include>
                  <lib><str><![CDATA[/ucrt64/lib]]></str></lib>
                </wx>
              </builtin>
            </global_variables>
          </codeblocks_config>
          EOF

      # 4. 生成 Makefile 并编译 Release
      - name: Build Project (Release)
        run: |
          CONF_PATH="$HOME/AppData/Roaming/codeblocks/default.conf"

          # 1. 使用正确的配置文件生成 Makefile
          cbp2make -in ImageLabelGui.cbp -out Makefile -config "$CONF_PATH"

          # 2. 如果 cbp2make 生成的 Makefile 中仍包含没替换的 ` --cflags`，用 sed 保险替换一次
          sed -i 's/` --cflags`/`wx-config --cflags`/g' Makefile
          sed -i 's/` --libs`/`wx-config --libs`/g' Makefile

          # 3. 编译 release
          make -f Makefile release

      # 5. 打包 EXE 以及引用的动态链接库 (DLL)
      - name: Collect Executable and DLL Dependencies
        run: |
          mkdir -p dist
          EXE_PATH=$(find . -name "*.exe" | grep -i "release" | head -n 1)
          if [ -z "$EXE_PATH" ]; then
            EXE_PATH=$(find . -name "*.exe" | head -n 1)
          fi
          echo "Found executable at: $EXE_PATH"
          cp "$EXE_PATH" dist/
          EXE_NAME=$(basename "$EXE_PATH")
          copypedeps -X dist/"$EXE_NAME" dist/

      # 6. 上传 Artifact 构建产物
      - name: Archive Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: image-label-gui-win64-ucrt
          path: dist/