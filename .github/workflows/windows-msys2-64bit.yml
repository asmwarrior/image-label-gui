name: Build image-label-gui (Pure MSYS2 UCRT64)

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. 初始化 UCRT64 环境并安装所需依赖
      - name: Setup MSYS2 environment (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            curl
            unzip
            make
            dos2unix
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-codeblocks
            mingw-w64-ucrt-x86_64-wxwidgets3.3-msw

      # 2. 安装 pedeps 工具
      - name: Install pedeps
        run: |
          LATEST_VERSION=$(curl -s https://api.github.com/repos/brechtsanders/pedeps/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          curl -sL "https://github.com/brechtsanders/pedeps/releases/download/${LATEST_VERSION}/pedeps-${LATEST_VERSION}-win64.zip" -o pedeps.zip
          unzip -q pedeps.zip -d /tmp/pedeps
          cp /tmp/pedeps/bin/* /ucrt64/bin/
          rm -rf pedeps.zip /tmp/pedeps

      # 3. 生成 Makefile、修复环境变量和命令后编译
      - name: Build Project (Release)
        run: |
          # 1. 生成 Makefile 并转换为 Unix 换行符
          cbp2make -in ImageLabelGui.cbp -out Makefile
          dos2unix Makefile

          # 2. 修正 Makefile 中的变量与命令问题
          sed -i '1i WX_CONFIG = wx-config' Makefile

          # a) C++ 编译与链接标志替换
          sed -i -E 's/`\$\(WX_CONFIG\)[[:space:]]*--cflags`/`wx-config --cflags`/g' Makefile
          sed -i -E 's/`\$\(WX_CONFIG\)[[:space:]]*--libs[[:space:]]*all`/`wx-config --libs all`/g' Makefile
          sed -i -E 's/`\$\(WX_CONFIG\)[[:space:]]*--libs`/`wx-config --libs`/g' Makefile

          # b) 修正 windres 编译命令，注入 `wx-config --rcflags`
          sed -i -E 's/\$\(WINDRES\)(.*)\$\(INC_RELEASE\)/\$(WINDRES)\1\$(INC_RELEASE) `wx-config --rcflags`/g' Makefile
          sed -i -E 's/\$\(WINDRES\)(.*)\$\(INC_DEBUG\)/\$(WINDRES)\1\$(INC_DEBUG) `wx-config --rcflags`/g' Makefile

          # c) 将 Windows 风格的 cmd 命令替换为标准的 POSIX 命令
          sed -i -E 's/cmd \/c if not exist ([^ ]+) md ([^ ]+)/mkdir -p \2/g' Makefile
          sed -i -E 's/cmd \/c del \/f/rm -f/g' Makefile
          sed -i -E 's/cmd \/c rd/rm -rf/g' Makefile

          # 3. 打印修正后的 Makefile 内容供确认
          echo "=================== FIXED MAKEFILE ==================="
          cat Makefile
          echo "======================================================="

          # 4. 执行 Release 构建
          make -f Makefile release

      # 4. 打包 EXE 以及引用的动态链接库 (DLL)
      - name: Collect Executable and DLL Dependencies
        run: |
          mkdir -p dist
          EXE_PATH=$(find . -name "*.exe" | grep -i "release" | head -n 1)
          if [ -z "$EXE_PATH" ]; then
            EXE_PATH=$(find . -name "*.exe" | head -n 1)
          fi
          echo "Found executable at: $EXE_PATH"
          cp "$EXE_PATH" dist/
          EXE_NAME=$(basename "$EXE_PATH")
          copypedeps -X dist/"$EXE_NAME" dist/

      # 5. 上传 Artifact 构建产物
      - name: Archive Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: image-label-gui-win64-ucrt
          path: dist/