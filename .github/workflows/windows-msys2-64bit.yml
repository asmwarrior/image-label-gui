name: Build image-label-gui (Windows Cmd + MinGW)

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    # 默认全部步骤使用 CMD 运行
    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. 使用 setup-msys2 安装 UCRT64 工具链
      - name: Setup MSYS2 environment (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            curl
            unzip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-codeblocks
            mingw-w64-ucrt-x86_64-wxwidgets3.3-msw

      # 1.5. 方案1：将 UCRT64 工具链永久加入 GitHub Actions 全局 PATH
      - name: Add UCRT64 toolchain to GITHUB_PATH
        run: |
          echo C:\msys64\ucrt64\bin>> %GITHUB_PATH%
          echo C:\msys64\usr\bin>> %GITHUB_PATH%

      # 2. 编译并安装 wx-config-msys2
      - name: Build and Install wx-config-msys2
        run: |
          :: 1. 克隆仓库
          git clone https://github.com/eranif/wx-config-msys2.git C:\tmp\wx-config-msys2

          :: 2. 配置并编译 (将安装路径直接设置为 C:/msys64/ucrt64)
          mkdir C:\tmp\wx-config-msys2\build
          cd /d C:\tmp\wx-config-msys2\build
          cmake .. -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=C:/msys64/ucrt64
          mingw32-make

          :: 3. 使用 cmake 自动安装到 C:\msys64\ucrt64\bin 目录
          cmake --install .

      # 3. 安装 pedeps
      - name: Install pedeps
        shell: msys2 {0}
        run: |
          LATEST_VERSION=$(curl -s https://api.github.com/repos/brechtsanders/pedeps/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          curl -sL "https://github.com/brechtsanders/pedeps/releases/download/${LATEST_VERSION}/pedeps-${LATEST_VERSION}-win64.zip" -o pedeps.zip
          unzip -q pedeps.zip -d /tmp/pedeps
          cp /tmp/pedeps/bin/* /ucrt64/bin/
          rm -rf pedeps.zip /tmp/pedeps

      # 4. 配置 Code::Blocks 全局配置 (default.conf)
      - name: Configure Code::Blocks Global Variables
        run: |
          if not exist "C:\Users\runneradmin\AppData\Roaming\codeblocks" mkdir "C:\Users\runneradmin\AppData\Roaming\codeblocks"
          
          (
            echo ^<?xml version="1.0" encoding="UTF-8" standalone="yes" ?^>
            echo ^<codeblocks_config file_version="1.0" app_version="1.0"^>
            echo   ^<macros^>
            echo     ^<WX_CONFIG^>
            echo       ^<str^>^<![CDATA[wx-config-msys2 --prefix=C:/msys64/ucrt64]]^>^</str^>
            echo     ^</WX_CONFIG^>
            echo   ^</macros^>
            echo   ^<compiler^>
            echo     ^<default_compiler^>
            echo       ^<str^>^<![CDATA[gcc]]^>^</str^>
            echo     ^</default_compiler^>
            echo     ^<sets^>
            echo       ^<gcc^>
            echo         ^<NAME^>^<str^>^<![CDATA[GNU GCC Compiler]]^>^</str^>^</NAME^>
            echo         ^<MASTER_PATH^>^<str^>^<![CDATA[C:\msys64\ucrt64]]^>^</str^>^</MASTER_PATH^>
            echo         ^<EXTRA_PATHS^>^<str^>^<![CDATA[C:\msys64\ucrt64\bin;]]^>^</str^>^</EXTRA_PATHS^>
            echo         ^<C_COMPILER^>^<str^>^<![CDATA[gcc.exe]]^>^</str^>^</C_COMPILER^>
            echo         ^<CPP_COMPILER^>^<str^>^<![CDATA[g++.exe]]^>^</str^>^</CPP_COMPILER^>
            echo         ^<LINKER^>^<str^>^<![CDATA[g++.exe]]^>^</str^>^</LINKER^>
            echo         ^<LIB_LINKER^>^<str^>^<![CDATA[ar.exe]]^>^</str^>^</LIB_LINKER^>
            echo         ^<RES_COMPILER^>^<str^>^<![CDATA[windres.exe]]^>^</str^>^</RES_COMPILER^>
            echo         ^<MAKE^>^<str^>^<![CDATA[mingw32-make.exe]]^>^</str^>^</MAKE^>
            echo       ^</gcc^>
            echo     ^</sets^>
            echo   ^</compiler^>
            echo ^</codeblocks_config^>
          ) > "C:\Users\runneradmin\AppData\Roaming\codeblocks\default.conf"

      # 5. 生成 Makefile 并用 mingw32-make 编译 Release
      - name: Build Project (Release)
        run: |
          :: 生成 Makefile
          cbp2make -in ImageLabelGui.cbp -out Makefile -config "C:\Users\runneradmin\AppData\Roaming\codeblocks\default.conf"
          
          :: 使用 mingw32-make 编译 release
          mingw32-make -f Makefile release

      # 6. 打包依赖项 ( pedeps )
      - name: Collect Executable and DLL Dependencies
        shell: msys2 {0}
        run: |
          mkdir -p dist
          EXE_PATH=$(find . -name "*.exe" | grep -i "release" | head -n 1)
          if [ -z "$EXE_PATH" ]; then
            EXE_PATH=$(find . -name "*.exe" | head -n 1)
          fi
          echo "Found executable at: $EXE_PATH"
          cp "$EXE_PATH" dist/
          EXE_NAME=$(basename "$EXE_PATH")
          copypedeps -X dist/"$EXE_NAME" dist/

      - name: Archive Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: image-label-gui-win64-ucrt
          path: dist/