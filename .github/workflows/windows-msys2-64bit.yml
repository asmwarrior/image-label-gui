name: Build image-label-gui (Pure MSYS2 UCRT64)

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    # 全局默认使用 MSYS2 Shell 运行所有步骤
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. 初始化 UCRT64 环境并安装所需依赖
      - name: Setup MSYS2 environment (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            curl
            unzip
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-codeblocks
            mingw-w64-ucrt-x86_64-wxwidgets3.3-msw

      # 2. 在 MSYS2 下构建并安装 wx-config-msys2 (生成器用 Unix Makefiles)
      - name: Build and Install wx-config-msys2
        run: |
          git clone https://github.com/eranif/wx-config-msys2.git /tmp/wx-config-msys2
          mkdir -p /tmp/wx-config-msys2/build
          cd /tmp/wx-config-msys2/build
          cmake .. -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/ucrt64
          make
          make install

      # 3. 安装 pedeps 工具
      - name: Install pedeps
        run: |
          LATEST_VERSION=$(curl -s https://api.github.com/repos/brechtsanders/pedeps/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          curl -sL "https://github.com/brechtsanders/pedeps/releases/download/${LATEST_VERSION}/pedeps-${LATEST_VERSION}-win64.zip" -o pedeps.zip
          unzip -q pedeps.zip -d /tmp/pedeps
          cp /tmp/pedeps/bin/* /ucrt64/bin/
          rm -rf pedeps.zip /tmp/pedeps

      # 4. 配置 Code::Blocks 全局配置 default.conf (Linux 风格 HEREDOC，不需要转义)
      - name: Configure Code::Blocks Global Variables
        run: |
          CB_CONFIG_DIR="$HOME/AppData/Roaming/codeblocks"
          mkdir -p "$CB_CONFIG_DIR"

          cat << 'EOF' > "$CB_CONFIG_DIR/default.conf"
          <?xml version="1.0" encoding="UTF-8" standalone="yes" ?>
          <codeblocks_config file_version="1.0" app_version="1.0">
            <macros>
              <WX_CONFIG>
                <str><![CDATA[wx-config-msys2 --prefix=C:/msys64/ucrt64]]></str>
              </WX_CONFIG>
            </macros>
            <compiler>
              <default_compiler>
                <str><![CDATA[gcc]]></str>
              </default_compiler>
              <sets>
                <gcc>
                  <NAME>
                    <str><![CDATA[GNU GCC Compiler]]></str>
                  </NAME>
                  <MASTER_PATH>
                    <str><![CDATA[C:\msys64\ucrt64]]></str>
                  </MASTER_PATH>
                  <EXTRA_PATHS>
                    <str><![CDATA[C:\msys64\ucrt64\bin;]]></str>
                  </EXTRA_PATHS>
                  <C_COMPILER>
                    <str><![CDATA[gcc.exe]]></str>
                  </C_COMPILER>
                  <CPP_COMPILER>
                    <str><![CDATA[g++.exe]]></str>
                  </CPP_COMPILER>
                  <LINKER>
                    <str><![CDATA[g++.exe]]></str>
                  </LINKER>
                  <LIB_LINKER>
                    <str><![CDATA[ar.exe]]></str>
                  </LIB_LINKER>
                  <RES_COMPILER>
                    <str><![CDATA[windres.exe]]></str>
                  </RES_COMPILER>
                  <MAKE>
                    <str><![CDATA[make.exe]]></str>
                  </MAKE>
                </gcc>
              </sets>
            </compiler>
          </codeblocks_config>
          EOF

      # 5. 生成 Makefile 并直接使用 make 编译
      - name: Build Project (Release)
        run: |
          # cbp2make 会自动在 /ucrt64/bin 中找到
          cbp2make -in ImageLabelGui.cbp -out Makefile -config "$HOME/AppData/Roaming/codeblocks/default.conf"
          
          # 编译 Release target
          make -f Makefile release

      # 6. 打包 EXE 以及引用的 DLL (pedeps)
      - name: Collect Executable and DLL Dependencies
        run: |
          mkdir -p dist
          EXE_PATH=$(find . -name "*.exe" | grep -i "release" | head -n 1)
          if [ -z "$EXE_PATH" ]; then
            EXE_PATH=$(find . -name "*.exe" | head -n 1)
          fi
          echo "Found executable at: $EXE_PATH"
          cp "$EXE_PATH" dist/
          EXE_NAME=$(basename "$EXE_PATH")
          copypedeps -X dist/"$EXE_NAME" dist/

      # 7. 上传 Artifact
      - name: Archive Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: image-label-gui-win64-ucrt
          path: dist/