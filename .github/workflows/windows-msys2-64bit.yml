name: Build image-label-gui (MSYS2 UCRT64 & pedeps)

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2 environment (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            curl
            unzip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-codeblocks
            mingw-w64-ucrt-x86_64-wxwidgets3.3-msw

      - name: Install pedeps tool
        run: |
          # Fetch the latest pedeps release version and extract it to UCRT64 bin directory
          LATEST_VERSION=$(curl -s https://api.github.com/repos/brechtsanders/pedeps/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          echo "Latest pedeps version: ${LATEST_VERSION}"
          curl -sL "https://github.com/brechtsanders/pedeps/releases/download/${LATEST_VERSION}/pedeps-${LATEST_VERSION}-win64.zip" -o pedeps.zip
          unzip -q pedeps.zip -d /tmp/pedeps
          cp /tmp/pedeps/bin/* /ucrt64/bin/
          rm -rf pedeps.zip /tmp/pedeps

      - name: Configure Code::Blocks Compiler Path
        run: |
          # Create Code::Blocks config directory in AppData
          CB_CONFIG_DIR="$APPDATA/codeblocks"
          mkdir -p "$CB_CONFIG_DIR"

          # Write minimal default.conf pointing GNU GCC Compiler to UCRT64 paths
          cat << 'EOF' > "$CB_CONFIG_DIR/default.conf"
          <?xml version="1.0" encoding="UTF-8" standalone="yes" ?>
          <codeblocks_config file_version="1.0" app_version="1.0">
            <app>
              <environment>
                <!-- Skip compiler auto-detection dialog on first startup -->
                <auto_detect_compilers>
                  <bool>
                    <![CDATA[0]]>
                  </bool>
                </auto_detect_compilers>
              </environment>
            </app>
            <compiler>
              <sets>
                <gcc>
                  <NAME>
                    <str>
                      <![CDATA[GNU GCC Compiler]]>
                    </str>
                  </NAME>
                  <MASTER_PATH>
                    <str>
                      <![CDATA[C:\msys64\ucrt64]]>
                    </str>
                  </MASTER_PATH>
                  <EXTRA_PATHS>
                    <str>
                      <![CDATA[C:\msys64\ucrt64\bin;]]>
                    </str>
                  </EXTRA_PATHS>
                  <C_COMPILER>
                    <str>
                      <![CDATA[gcc.exe]]>
                    </str>
                  </C_COMPILER>
                  <CPP_COMPILER>
                    <str>
                      <![CDATA[g++.exe]]>
                    </str>
                  </CPP_COMPILER>
                  <LINKER>
                    <str>
                      <![CDATA[g++.exe]]>
                    </str>
                  </LINKER>
                  <LIB_LINKER>
                    <str>
                      <![CDATA[ar.exe]]>
                    </str>
                  </LIB_LINKER>
                  <RES_COMPILER>
                    <str>
                      <![CDATA[windres.exe]]>
                    </str>
                  </RES_COMPILER>
                  <MAKE>
                    <str>
                      <![CDATA[mingw32-make.exe]]>
                    </str>
                  </MAKE>
                </gcc>
              </sets>
            </compiler>
          </codeblocks_config>
          EOF

      - name: Build Code::Blocks Project
        run: |
          # Quietly build the Code::Blocks project in CLI mode
          codeblocks --no-splash-screen --no-associative --no-dde --target="Release" --build image-label-gui.cbp

      - name: Collect Executable and DLL Dependencies using pedeps
        run: |
          mkdir -p dist
          
          # Find the compiled executable file
          EXE_PATH=$(find . -name "*.exe" | head -n 1)
          if [ -z "$EXE_PATH" ]; then
            echo "Error: Executable file not found!"
            exit 1
          fi
          
          echo "Found executable at: $EXE_PATH"
          cp "$EXE_PATH" dist/

          # Recursively copy all dependent DLLs using copypedeps; -X ignores system DLLs
          EXE_NAME=$(basename "$EXE_PATH")
          copypedeps -X dist/"$EXE_NAME" dist/

      - name: Archive Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: image-label-gui-win64-ucrt
          path: dist/