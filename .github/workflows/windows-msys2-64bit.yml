name: Build image-label-gui (Pure MSYS2 UCRT64)

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. 初始化 UCRT64 环境并安装所需依赖 (包含 dos2unix 用于处理 Makefile)
      - name: Setup MSYS2 environment (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            curl
            unzip
            make
            dos2unix
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-codeblocks
            mingw-w64-ucrt-x86_64-wxwidgets3.3-msw

      # 2. 安装 pedeps 工具
      - name: Install pedeps
        run: |
          LATEST_VERSION=$(curl -s https://api.github.com/repos/brechtsanders/pedeps/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          curl -sL "https://github.com/brechtsanders/pedeps/releases/download/${LATEST_VERSION}/pedeps-${LATEST_VERSION}-win64.zip" -o pedeps.zip
          unzip -q pedeps.zip -d /tmp/pedeps
          cp /tmp/pedeps/bin/* /ucrt64/bin/
          rm -rf pedeps.zip /tmp/pedeps

      # 3. 生成 Makefile，打印内容并编译
      - name: Build Project (Release)
        run: |
          # 1. 直接生成 Makefile
          cbp2make -in ImageLabelGui.cbp -out Makefile

          # 2. 将 Makefile 转为 Unix 换行符
          dos2unix Makefile

          # 3. 打印原始 Makefile 完整内容到 Log
          echo "=================== ORIGINAL MAKEFILE ==================="
          cat Makefile
          echo "========================================================="

          # 4. 替换缺失的 wx-config 命令
          sed -i -E 's/`[[:space:]]*--cflags`/`wx-config --cflags`/g' Makefile
          sed -i -E 's/`[[:space:]]*--libs`/`wx-config --libs`/g' Makefile

          # 5. 打印替换后的 Makefile 完整内容到 Log
          echo "=================== MODIFIED MAKEFILE ==================="
          cat Makefile
          echo "========================================================="

          # 6. 执行编译
          make -f Makefile release

      # 4. 打包 EXE 以及引用的动态链接库 (DLL)
      - name: Collect Executable and DLL Dependencies
        run: |
          mkdir -p dist
          EXE_PATH=$(find . -name "*.exe" | grep -i "release" | head -n 1)
          if [ -z "$EXE_PATH" ]; then
            EXE_PATH=$(find . -name "*.exe" | head -n 1)
          fi
          echo "Found executable at: $EXE_PATH"
          cp "$EXE_PATH" dist/
          EXE_NAME=$(basename "$EXE_PATH")
          copypedeps -X dist/"$EXE_NAME" dist/

      # 5. 上传 Artifact 构建产物
      - name: Archive Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: image-label-gui-win64-ucrt
          path: dist/