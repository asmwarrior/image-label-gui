name: Build image-label-gui (Pure MSYS2 UCRT64)

on:
  workflow_dispatch:

# Allow GitHub Actions to create Tags and Releases
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Initialize the MSYS2 UCRT64 environment and install required dependencies
      - name: Setup MSYS2 environment (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            curl
            unzip
            zip
            make
            dos2unix
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-codeblocks
            mingw-w64-ucrt-x86_64-wxwidgets3.3-msw

      # 2. Install the pedeps tool
      - name: Install pedeps
        run: |
          LATEST_VERSION=$(curl -s https://api.github.com/repos/brechtsanders/pedeps/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          curl -sL "https://github.com/brechtsanders/pedeps/releases/download/${LATEST_VERSION}/pedeps-${LATEST_VERSION}-win64.zip" -o pedeps.zip
          unzip -q pedeps.zip -d /tmp/pedeps
          cp /tmp/pedeps/bin/* /ucrt64/bin/
          rm -rf pedeps.zip /tmp/pedeps

      # 3. Generate the Makefile, fix environment variables and commands, then build
      - name: Build Project (Release)
        run: |
          # 1. Generate the Makefile and convert it to Unix line endings
          cbp2make -in ImageLabelGui.cbp -out Makefile
          dos2unix Makefile

          # 2. Fix variables and commands in the Makefile
          sed -i '1i WX_CONFIG = wx-config' Makefile

          # a) Replace C++ compilation and linking flags
          sed -i -E 's/`\$\(WX_CONFIG\)[[:space:]]*--cflags`/`wx-config --cflags`/g' Makefile
          sed -i -E 's/`\$\(WX_CONFIG\)[[:space:]]*--libs[[:space:]]*all`/`wx-config --libs all`/g' Makefile
          sed -i -E 's/`\$\(WX_CONFIG\)[[:space:]]*--libs`/`wx-config --libs`/g' Makefile

          # b) Fix windres commands by injecting `wx-config --cflags`
          #    to resolve resource file include paths
          sed -i -E 's/\$\(WINDRES\)(.*)\$\(INC_RELEASE\)/\$(WINDRES)\1\$(INC_RELEASE) `wx-config --cflags`/g' Makefile
          sed -i -E 's/\$\(WINDRES\)(.*)\$\(INC_DEBUG\)/\$(WINDRES)\1\$(INC_DEBUG) `wx-config --cflags`/g' Makefile

          # c) Replace Windows-style cmd commands with standard POSIX commands
          sed -i -E 's/cmd \/c if not exist ([^ ]+) md ([^ ]+)/mkdir -p \2/g' Makefile
          sed -i -E 's/cmd \/c del \/f/rm -f/g' Makefile
          sed -i -E 's/cmd \/c rd/rm -rf/g' Makefile

          # 3. Print the fixed Makefile for verification
          echo "=================== FIXED MAKEFILE ==================="
          cat Makefile
          echo "======================================================="

          # 4. Perform the Release build
          make -f Makefile release

      # 4. Collect the executable and DLL dependencies
      #    following Code::Blocks best practices
      - name: Collect Executable and DLL Dependencies
        run: |
          # 1. Create the distribution directory
          mkdir -p dist

          # 2. Copy the built executable to the distribution directory
          cp bin/Release/ImageLabelGui.exe dist/

          # 3. Run copypedeps with -r (recursive), -n (do not overwrite),
          #    and -v (verbose) options
          #    Argument 1 (source file): dist/ImageLabelGui.exe
          #    Argument 2 (destination directory): dist/
          copypedeps -r -n -v dist/ImageLabelGui.exe dist/

          # 4. Print the final contents of the distribution directory
          echo "=================== DIST CONTENTS ==================="
          ls -lh dist/
          echo "====================================================="

      # 5. Create the ZIP package
      - name: Create ZIP package
        run: |
          ZIP_NAME="image-label-gui-win64-ucrt.zip"

          # Save the ZIP filename for use by later steps
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"

          # Package the contents of the dist directory
          cd dist
          zip -r "../${ZIP_NAME}" .
          cd ..

          echo "=================== ZIP PACKAGE ==================="
          ls -lh "${ZIP_NAME}"
          echo "===================================================="

      # 6. Create a GitHub Release and upload the ZIP package
      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $timestamp = [DateTime]::UtcNow.AddHours(8).ToString("yyyy-MM-dd HH:mm:ss")
          $tagTimestamp = [DateTime]::UtcNow.AddHours(8).ToString("yyyy-MM-ddTHH-mm-ss")

          $tagName = "manual-$tagTimestamp"
          $releaseTitle = "Build $timestamp (UTC+08:00)"

          Write-Host "Tag: $tagName"
          Write-Host "Release: $releaseTitle"
          Write-Host "Asset: $env:ZIP_NAME"

          gh release create $tagName `
            $env:ZIP_NAME `
            --title $releaseTitle `
            --notes "Manual build from commit $env:GITHUB_SHA"
