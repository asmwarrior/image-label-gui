name: Build image-label-gui (MSYS2 UCRT64 & wx-config-msys2)

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2 environment (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            curl
            unzip
            cmake
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-codeblocks
            mingw-w64-ucrt-x86_64-wxwidgets3.3-msw

      - name: Build and Install wx-config-msys2
        run: |
          # 1. Clone wx-config-msys2 repository
          git clone https://github.com/eranif/wx-config-msys2.git /tmp/wx-config-msys2

          # 2. Build via CMake
          mkdir -p /tmp/wx-config-msys2/build
          cd /tmp/wx-config-msys2/build
          cmake .. -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
          mingw32-make

          # 3. Copy binary into UCRT64 bin directory
          cp wx-config-msys2.exe /ucrt64/bin/

      - name: Install pedeps tool
        run: |
          # Fetch the latest pedeps release version and extract it to UCRT64 bin directory
          LATEST_VERSION=$(curl -s https://api.github.com/repos/brechtsanders/pedeps/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          echo "Latest pedeps version: ${LATEST_VERSION}"
          curl -sL "https://github.com/brechtsanders/pedeps/releases/download/${LATEST_VERSION}/pedeps-${LATEST_VERSION}-win64.zip" -o pedeps.zip
          unzip -q pedeps.zip -d /tmp/pedeps
          cp /tmp/pedeps/bin/* /ucrt64/bin/
          rm -rf pedeps.zip /tmp/pedeps

      - name: Configure Code::Blocks Global Variables (WX_CONFIG with --prefix)
        run: |
          # Set WX_CONFIG to "wx-config-msys2 --prefix=C:/msys64/ucrt64"
          CB_CONFIG_DIR="C:/Users/runneradmin/AppData/Roaming/codeblocks"
          mkdir -p "$CB_CONFIG_DIR"

          cat << 'EOF' > "$CB_CONFIG_DIR/default.conf"
          <?xml version="1.0" encoding="UTF-8" standalone="yes" ?>
          <codeblocks_config file_version="1.0" app_version="1.0">
            <macros>
              <WX_CONFIG>
                <str><![CDATA[wx-config-msys2 --prefix=C:/msys64/ucrt64]]></str>
              </WX_CONFIG>
            </macros>
            <compiler>
              <default_compiler>
                <str><![CDATA[gcc]]></str>
              </default_compiler>
              <sets>
                <gcc>
                  <NAME>
                    <str><![CDATA[GNU GCC Compiler]]></str>
                  </NAME>
                  <MASTER_PATH>
                    <str><![CDATA[C:\msys64\ucrt64]]></str>
                  </MASTER_PATH>
                  <EXTRA_PATHS>
                    <str><![CDATA[C:\msys64\ucrt64\bin;]]></str>
                  </EXTRA_PATHS>
                  <C_COMPILER>
                    <str><![CDATA[gcc.exe]]></str>
                  </C_COMPILER>
                  <CPP_COMPILER>
                    <str><![CDATA[g++.exe]]></str>
                  </CPP_COMPILER>
                  <LINKER>
                    <str><![CDATA[g++.exe]]></str>
                  </LINKER>
                  <LIB_LINKER>
                    <str><![CDATA[ar.exe]]></str>
                  </LIB_LINKER>
                  <RES_COMPILER>
                    <str><![CDATA[windres.exe]]></str>
                  </RES_COMPILER>
                  <MAKE>
                    <str><![CDATA[mingw32-make.exe]]></str>
                  </MAKE>
                </gcc>
              </sets>
            </compiler>
          </codeblocks_config>
          EOF

      - name: Build Project (Release Only)
        run: |
          # 1. Convert ImageLabelGui.cbp using default.conf
          cbp2make -in ImageLabelGui.cbp -out Makefile -config "C:/Users/runneradmin/AppData/Roaming/codeblocks/default.conf"

          # 2. Build Release target exclusively
          mingw32-make -f Makefile release

      - name: Collect Executable and DLL Dependencies using pedeps
        run: |
          mkdir -p dist

          # Find compiled release executable
          EXE_PATH=$(find . -name "*.exe" | grep -i "release" | head -n 1)
          if [ -z "$EXE_PATH" ]; then
            EXE_PATH=$(find . -name "*.exe" | head -n 1)
          fi

          if [ -z "$EXE_PATH" ]; then
            echo "Error: Executable file not found!"
            exit 1
          fi

          echo "Found executable at: $EXE_PATH"
          cp "$EXE_PATH" dist/

          # Recursively copy dependent DLLs
          EXE_NAME=$(basename "$EXE_PATH")
          copypedeps -X dist/"$EXE_NAME" dist/

      - name: Archive Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: image-label-gui-win64-ucrt
          path: dist/